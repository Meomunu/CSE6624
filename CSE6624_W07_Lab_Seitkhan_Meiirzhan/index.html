<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 07</title>
    <style>
        header{ background: blue; text-align: center; }
        footer{ background: blue; text-align: center; }
        .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .card { border: 1px solid black}
        @media (max-width: 900px) {
            .features { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .features { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header><h1>Header</h1></header>
    <section><h2>Section</h2></section>
    <main class="features">
        <div class="card"><h3>Feature 1</h3></div>
        <div class="card"><h3>Feature 2</h3></div>
        <div class="card"><h3>Feature 3</h3></div>
    </main>
    <footer><p>Footer</p></footer>
</body>
</html>
