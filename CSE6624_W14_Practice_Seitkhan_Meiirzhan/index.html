
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCube Community</title>

    <style>
        body {
            font-family: Arial;
            background: #f5f8f1;
            color: #252525;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: #404E4D;
            color: white;
            max-width: 400px;
            margin: 30px auto;
            padding: 25px;
        }

        input, button {
            padding: 10px;
            margin: 10px;
        }

        a {
            color: #054A29;
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid #dd6b20;
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <a href="#main">Skip to content</a>

    <main id="main">
        <h1>MindCube Community</h1>

        <div class="box">
            <h2>You are not alone.</h2>
            <p>Share your thoughts and connect with others.</p>
        </div>

        <h2>Join our community</h2>

        <form>
            <label for="name">Your name:</label><br>
            <input type="text" id="name" required><br>

            <label for="topic">What do you need help with?</label><br>
            <select id="topic">
                <option>Discipline</option>
                <option>Education</option>
                <option>Relationships</option>
                <option>Stress</option>
            </select><br>

            <button type="submit">Join</button>
        </form>
    </main>

    <footer>
        <p>Meiirzhan Seitkhan | ID: 081011552746</p>
    </footer>

</body>
</html>
